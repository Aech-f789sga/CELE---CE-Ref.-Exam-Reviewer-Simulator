<script>
const W=800,H=1100,COLORS=["#111111","#2f6df6","#e5383b","#2a9d4f","#f4a300","#8e44ad","#ffffff"],COVERS=["#2f6df6","#e5383b","#2a9d4f","#f4a300","#8e44ad","#16a2b8"];
let lib=[],nb=null,pi=0,tool="pen",color=COLORS[0],size=3,cur=null,undo=[],redo=[],tmr;
const $=s=>document.querySelector(s),cv=$("#cv"),ctx=cv.getContext("2d");
try{lib=JSON.parse(localStorage.getItem("inkpad")||"[]")}catch(e){lib=[]}
function save(){
  if(nb){
    nb.upd=Date.now();
    try{
      if(nb.pages&&nb.pages[0]){
        const tc=document.createElement("canvas");
        tc.width=240;tc.height=330;
        const tx=tc.getContext("2d");
        tx.scale(0.3,0.3);
        render(tx,nb.pages[0]);
        nb.thumbnail=tc.toDataURL("image/jpeg",0.75);
      }
    }catch(err){}
  }
  clearTimeout(tmr);
  tmr=setTimeout(()=>{
    try{
      localStorage.setItem("inkpad",JSON.stringify(lib));
      window.dispatchEvent(new Event("inkpad_updated"));
      if(window.parent&&window.parent!==window){
        window.parent.postMessage({type:"INKPAD_NOTEBOOK_SAVED",notebook:nb,all:lib},"*");
      }
    }catch(e){}
  },300);
}
const pg=()=>nb.pages[pi];
function bg(c,tpl,col){c.fillStyle=col||"#fff";c.fillRect(0,0,W,H);c.strokeStyle="rgba(120,140,170,.35)";c.lineWidth=1;c.fillStyle="rgba(120,140,170,.55)";
 if(tpl==="cornell"){for(let y=120;y<900;y+=32){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}c.strokeStyle="rgba(120,140,170,.8)";c.lineWidth=2;c.beginPath();c.moveTo(220,70);c.lineTo(220,900);c.moveTo(0,900);c.lineTo(W,900);c.stroke();c.lineWidth=1}
 if(tpl==="lined"){for(let y=120;y<H;y+=32){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}c.strokeStyle="#f0a0a0";c.beginPath();c.moveTo(90,0);c.lineTo(90,H);c.stroke()}
 if(tpl==="grid"){for(let x=0;x<W;x+=32){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke()}for(let y=0;y<H;y+=32){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}}
 if(tpl==="dot"){for(let x=32;x<W;x+=32)for(let y=32;y<H;y+=32){c.beginPath();c.arc(x,y,1.5,0,7);c.fill()}}}
const IM={};function img(s){let i=IM[s.src];if(!i){i=IM[s.src]=new Image();i.onload=()=>{draw();thumbs()};i.src=s.src}return i}
function fnt(c,s){c.font=`${s.s}px ${FF(s.f)}`;c.textBaseline="top"}
function bb0(s,c=ctx){if(s.t==="text"){const L=wrap(c,s);return[s.x,s.y,s.x+Math.max(12,...L.map(l=>c.measureText(l).width)),s.y+L.length*s.s*1.3]}
 if(s.t==="img")return[s.x,s.y,s.x+s.w,s.y+s.h];
 if(s.t==="shape"){const z=s.k==="ax3"?zEnd(s):s.a;return[Math.min(s.a[0],s.b[0],z[0]),Math.min(s.a[1],s.b[1],z[1]),Math.max(s.a[0],s.b[0],z[0]),Math.max(s.a[1],s.b[1],z[1])]}
 const xs=s.p.map(q=>q[0]),ys=s.p.map(q=>q[1]);return[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]}
function mv(a,dx,dy){a.forEach(s=>{if(s.p)s.p=s.p.map(q=>q.length>2?[q[0]+dx,q[1]+dy,q[2]]:[q[0]+dx,q[1]+dy]);if(s.er)s.er=s.er.map(e=>({w:e.w,p:e.p.map(q=>[q[0]+dx,q[1]+dy])}));if(s.a){s.a=[s.a[0]+dx,s.a[1]+dy];s.b=[s.b[0]+dx,s.b[1]+dy]}if(s.x!==undefined){s.x+=dx;s.y+=dy}})}
function stroke(c,s){
 if(s.r&&!inR){const b=bb0(s),cx=(b[0]+b[2])/2,cy=(b[1]+b[3])/2;c.save();c.translate(cx,cy);c.rotate(s.r);c.translate(-cx,-cy);inR=1;stroke(c,s);inR=0;c.restore();return}
 if(s.er&&s.er.length&&!inE&&s.t!=="ers"){drawErased(c,s);return}
 if(s.t==="ers"){c.save();c.globalCompositeOperation="destination-out";c.lineCap=c.lineJoin="round";c.lineWidth=s.w;c.strokeStyle="#000";pth(c,s.p);c.stroke();c.restore();return}
 if(s.t==="img"){const rc=RC.get(s);if(rc){c.drawImage(rc,s.x,s.y,s.w,s.h);return}const i=img(s);if(i.complete&&i.naturalWidth)c.drawImage(i,s.x,s.y,s.w,s.h);return}
 if(s.t==="text"){fnt(c,s);c.fillStyle=s.c;wrap(c,s).forEach((l,i)=>c.fillText(l,s.x,s.y+i*s.s*1.3));return}
 if(s.t==="shape"){shp(c,s);return}
 const p=s.p;if(!p.length)return;
 if(s.t==="pen"&&BRX[s.v]&&BRX[s.v].t){drawStamp(c,s,BRX[s.v],s===cur);return}

// 1. Export as PDF
$("#exp-pdf").onclick = async () => {
  if (!nb || !nb.pages.length) return;
  const status = $("#exp-status");
  status.style.display = "block";
  status.textContent = "Rendering high-res PDF (" + nb.pages.length + " page" + (nb.pages.length > 1 ? "s" : "") + ")...";
  try {
    const jsPdfLib = window.jspdf ? window.jspdf.jsPDF : null;
    if (jsPdfLib) {
      const doc = new jsPdfLib({ orientation: 'p', unit: 'pt', format: [W, H] });
      for (let i = 0; i < nb.pages.length; i++) {
        const c = document.createElement("canvas");
        c.width = W * DPI;
        c.height = H * DPI;
        const cx = c.getContext("2d");
        cx.scale(DPI, DPI);
        render(cx, nb.pages[i]);
        const imgData = c.toDataURL("image/jpeg", 0.92);
        if (i > 0) doc.addPage([W, H], 'p');
        doc.addImage(imgData, 'JPEG', 0, 0, W, H);
      }
      const safeTitle = (nb.name || "Inkpad_Notes").replace(/[^a-zA-Z0-9_-]/g, "_");
      doc.save(safeTitle + ".pdf");
      status.textContent = "✓ PDF exported and downloaded successfully!";
    } else {
      downloadAllPagesPng();
      status.textContent = "✓ Exported all pages as high-res images!";
    }
    setTimeout(() => { status.style.display = "none"; $("#exp-modal").style.display = "none"; }, 2000);
  } catch(err) {
    status.textContent = "PDF export notice: " + (err.message || err);
    setTimeout(() => { status.style.display = "none"; }, 4000);
  }
};

// 2. Export Current Page (PNG)
$("#exp-png-cur").onclick = () => {
  if (!nb) return;
  const c = document.createElement("canvas");

  c.height = H * DPI;
  const cx = c.getContext("2d");
  cx.scale(DPI, DPI);
  render(cx, pg());
  const a = document.createElement("a");
  const safeTitle = (nb.name || "Inkpad_Notes").replace(/[^a-zA-Z0-9_-]/g, "_");
  a.download = safeTitle + "_Page_" + (pi + 1) + "_" + (DPI * 100) + "DPI.png";
  a.href = c.toDataURL("image/png");
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  const status = $("#exp-status");
  status.style.display = "block";
  status.textContent = "✓ Page " + (pi + 1) + " PNG downloaded!";
  setTimeout(() => { status.style.display = "none"; $("#exp-modal").style.display = "none"; }, 1500);
};

// 3. Export All Pages (PNGs)
function downloadAllPagesPng() {
  if (!nb) return;
  const safeTitle = (nb.name || "Inkpad_Notes").replace(/[^a-zA-Z0-9_-]/g, "_");
  nb.pages.forEach((p, idx) => {
    const c = document.createElement("canvas");
    c.width = W * DPI;
    c.height = H * DPI;
    const cx = c.getContext("2d");
    cx.scale(DPI, DPI);
    render(cx, p);
    const a = document.createElement("a");
    a.download = safeTitle + "_Page_" + (idx + 1) + "_" + (DPI * 100) + "DPI.png";
    a.href = c.toDataURL("image/png");
    document.body.appendChild(a);
    setTimeout(() => {
      a.click();
      document.body.removeChild(a);
    }, idx * 250);
  });
}
$("#exp-png-all").onclick = () => {
  downloadAllPagesPng();
  const status = $("#exp-status");
  status.style.display = "block";
  status.textContent = "✓ Downloading " + nb.pages.length + " page images...";
  setTimeout(() => { status.style.display = "none"; $("#exp-modal").style.display = "none"; }, 2000);
};

// 5. Export Notebook Bundle (.cescratch)
$("#exp-json").onclick = () => {
  if (!nb) return;
  const bundle = {
    format: "ce-scratchpad-bundle",
    version: "2.0",
    deviceCompat: "Universal Canvas / Tablet / Web (.cescratch)",
    metadata: {
      id: "inkpad_" + nb.id,
      title: nb.name || "Untitled",
      createdAt: new Date(nb.upd || Date.now()).toISOString(),
      updatedAt: new Date(nb.upd || Date.now()).toISOString(),
      type: "standalone",
      paperTexture: nb.pages[0]?.tpl || "blank",
      paperBgColor: nb.pages[0]?.col || nb.cover || "#06131c",
      dpi: DPI * 100,
      notesText: nb.pages.length + " sheet" + (nb.pages.length > 1 ? "s" : "") + " • Inkpad Studio Document",
      totalPages: nb.pages.length,
      thumbnail: nb.thumbnail
    },
    pages: nb.pages.map((p, idx) => ({ page: idx + 1, tpl: p.tpl, col: p.col, strokes: p.strokes }))
  };
  const blob = new Blob([JSON.stringify(bundle, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const safeTitle = (nb.name || "Inkpad_Notes").replace(/[^a-zA-Z0-9_-]/g, "_");
  a.download = safeTitle + ".cescratch";
  a.href = url;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  const status = $("#exp-status");
  status.style.display = "block";
  status.textContent = "✓ .cescratch backup downloaded!";
  setTimeout(() => { status.style.display = "none"; $("#exp-modal").style.display = "none"; }, 1500);
};

// 6. Print
$("#exp-print").onclick = () => {
  try {
    const h = $("#pr");
    h.innerHTML = "";
    nb.pages.forEach(p => {
      const c = document.createElement("canvas");
      c.width = W * DPI;
      c.height = H * DPI;
      const x = c.getContext("2d");
      x.scale(DPI, DPI);
      render(x, p);
      const i = new Image();
      i.src = c.toDataURL("image/jpeg", 0.9);
      h.append(i);
    });
    setTimeout(() => {
      try {
        window.print();
      } catch(err) {
        const status = $("#exp-status");
        status.style.display = "block";
        status.textContent = "Browser iframe prevented printing. Please use 'Export as PDF Document'!";
      }
    }, 400);
  } catch(e) {}
};

// Adaptive Theme and External Sync Listener
window.addEventListener("message",e=>{
  if(!e.data)return;
  if(e.data.type==="INKPAD_SET_THEME"){
    if(e.data.adapt){
      document.documentElement.setAttribute("data-theme","adaptive");
      if(e.data.vars){
        for(const[k,v]of Object.entries(e.data.vars)){
          document.documentElement.style.setProperty(k,v);
        }
      }
    }else{
      document.documentElement.removeAttribute("data-theme");
      document.documentElement.style.cssText="";
    }
  }else if(e.data.type==="INKPAD_OPEN_NOTEBOOK"){
    try{lib=JSON.parse(localStorage.getItem("inkpad")||"[]")}catch(err){lib=[]}
    const rawId=String(e.data.id||"").replace(/^inkpad_/,"");
    let found=lib.find(n=>String(n.id)===rawId||n.name===e.data.title);
    if(found){
      open(found);
    }else{
      const newNb={
        id:isNaN(+rawId)||!rawId?Date.now():+rawId,
        name:e.data.title||"CE Board Notebook",
        cover:COVERS[0],
        upd:Date.now(),
        pages:[{tpl:"lined",strokes:[]}]
      };
      lib.unshift(newNb);
      save();
      open(newNb);
    }
  }else if(e.data.type==="INKPAD_REFRESH_LIB"){
    try{lib=JSON.parse(localStorage.getItem("inkpad")||"[]")}catch(err){lib=[]}
    showLib();
  }
});
