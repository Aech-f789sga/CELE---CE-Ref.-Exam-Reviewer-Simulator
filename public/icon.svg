<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Subtle Blueprint Grid in safe zone -->
  <g stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.15">
    <line x1="96" y1="96" x2="416" y2="96"/>
    <line x1="96" y1="176" x2="416" y2="176"/>
    <line x1="96" y1="256" x2="416" y2="256"/>
    <line x1="96" y1="336" x2="416" y2="336"/>
    <line x1="96" y1="416" x2="416" y2="416"/>
    <line x1="96" y1="96" x2="96" y2="416"/>
    <line x1="176" y1="96" x2="176" y2="416"/>
    <line x1="256" y1="96" x2="256" y2="416"/>
    <line x1="336" y1="96" x2="336" y2="416"/>
    <line x1="416" y1="96" x2="416" y2="416"/>
  </g>

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="186" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-opacity="0.4" stroke-dasharray="8 6"/>

  <!-- Truss Bridge / Structural Engineering Beam Base -->
  <g filter="url(#glow)">
    <!-- Main Arch / Triangular Truss -->
    <path d="M 120 370 L 256 140 L 392 370 Z" fill="none" stroke="url(#goldGrad)" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Horizontal tie beam -->
    <line x1="120" y1="370" x2="392" y2="370" stroke="url(#goldGrad)" stroke-width="22" stroke-linecap="round"/>
    <!-- Internal webbing members -->
    <line x1="188" y1="370" x2="256" y2="255" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round"/>
    <line x1="324" y1="370" x2="256" y2="255" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round"/>
    <line x1="256" y1="140" x2="256" y2="370" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round"/>
    <!-- Center Joint Pin -->
    <circle cx="256" cy="140" r="18" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="8"/>
    <circle cx="256" cy="140" r="6" fill="#fbbf24"/>
    <circle cx="120" cy="370" r="14" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="6"/>
    <circle cx="392" cy="370" r="14" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="6"/>
  </g>

  <!-- Drafting Compass Pencil Lead / Pivot -->
  <path d="M 256 220 L 256 310" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>
  <circle cx="256" cy="310" r="4" fill="#f8fafc"/>

  <!-- "CE" Monogram Plaque at Bottom -->
  <rect x="180" y="396" width="152" height="42" rx="10" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="3"/>
  <text x="256" y="425" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" letter-spacing="4" text-anchor="middle">CE BOARD</text>
</svg>
